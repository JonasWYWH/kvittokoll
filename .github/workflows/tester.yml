name: Tester

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      # Verktyget kräver inga beroenden, så det som testas är att det
      # fungerar på de Python-versioner README lovar.
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Kör testerna
        run: python -m unittest discover -s tests -t tests -v
